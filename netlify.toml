[build]
  publish = "."
  command = "echo 'Static site — no build step required'"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Security headers ──────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache: static assets (long TTL) ──────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: HTML pages (short TTL — updated during festivals) ─
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

# ── Cache: JS modules (short TTL — updated during festivals) ─
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

# ── API ────────────────────────────────────────────────────
# Email capture stub (§9) → Netlify function
[[redirects]]
  from = "/api/subscribe"
  to   = "/.netlify/functions/subscribe"
  status = 200

# ── Redirects ──────────────────────────────────────────────
